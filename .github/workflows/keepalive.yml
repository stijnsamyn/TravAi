name: Supabase keep-alive

# Houdt het Supabase-project wakker. Gratis projecten worden gepauzeerd
# na 7 dagen zonder API-calls; deze workflow pingt om de 3 dagen.
#
# De gebruikte sleutel is de PUBLIEKE anon-key - die staat al in index.html
# en is bedoeld om publiek te zijn. RLS beschermt de data, niet de sleutel.

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://ddynbjwemgtcwienupnp.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRkeW5iandlbWd0Y3dpZW51cG5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NTI4NTAsImV4cCI6MjA5OTQyODg1MH0.wyW12xbgqp2S9P4yCOo1DW0TEFnYsfpD7g8uFeUf73I
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/trips?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${code}"
          echo "Response: $(cat /tmp/body.txt)"
          case "$code" in
            200|401|403) echo "Project is wakker." ;;
            *) echo "Onverwachte status ${code} - project mogelijk gepauzeerd."; exit 1 ;;
          esac
