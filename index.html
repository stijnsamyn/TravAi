<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TravAI">
<meta name="theme-color" content="#2fbe8f">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>TravAI — Reisplanner</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --green:#2fbe8f; --green-dark:#1e9e74; --green-soft:#e7f7f0; --green-ink:#14523d;
    --ink:#33475b; --muted:#8296a8; --bg:#f6f8f9; --card:#fff; --border:#e6ecf0;
    --pink:#e8467c; --pink-soft:#fdeef3; --amber:#f5a623; --amber-soft:#fdf3e3;
    --purple:#7c5cff; --red:#e5484d; --red-soft:#fdecec;
    --radius:16px; --shadow:0 1px 4px rgba(30,60,90,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Quicksand',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); font-weight:500;
    padding-top:env(safe-area-inset-top);
  }
  button{font-family:inherit}
  input,select,textarea{font-family:inherit;color:var(--ink)}
  i.ti{line-height:1;vertical-align:-2px}
  /* ===== top bar ===== */
  #hdr{
    background:#fff; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:500;
    padding:10px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .hbtn{
    background:#fff; border:1px solid var(--border); color:var(--ink);
    width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .htitle{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;overflow:hidden}
  .htitle .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
  .htitle h1{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
  .htitle h1 .ti{color:var(--green-dark)}
  .htitle .sub{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
  .pill{
    display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--border);
    border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .pill .ti{font-size:15px;color:var(--green-dark)}
  .donut{width:20px;height:20px;border-radius:50%;flex:none;position:relative;background:conic-gradient(var(--green) var(--p,0%), #e6ecf0 0)}
  .donut::after{content:'';position:absolute;inset:4px;border-radius:50%;background:#fff}
  .btn-share{
    background:var(--green);color:#fff;border:none;border-radius:99px;
    padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(47,190,143,.35);
    display:inline-flex;align-items:center;gap:7px;
  }
  .avatars{display:flex;align-items:center}
  .avatars .av{
    width:30px;height:30px;border-radius:50%;background:var(--green-soft);color:var(--green-ink);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
    border:2px solid #fff;margin-left:-8px;
  }
  .avatars .av:first-child{margin-left:0}
  /* ===== tab bar ===== */
  #tabbar{
    background:#fff;border-bottom:1px solid var(--border);position:sticky;z-index:490;
    display:flex;align-items:center;gap:4px;padding:8px 14px;overflow-x:auto;scrollbar-width:none;
  }
  #tabbar::-webkit-scrollbar{display:none}
  #tabbar .tabb{
    background:none;border:none;border-radius:99px;padding:9px 16px;font-size:14px;font-weight:700;
    color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;
  }
  #tabbar .tabb .ti{font-size:17px}
  #tabbar .tabb.on{background:var(--green-soft);color:var(--green-ink)}
  #tabbar .spacer{flex:1}
  /* ===== split layout ===== */
  .split{display:flex;flex-direction:column}
  .mappane{height:44vh;position:relative;z-index:1}
  .mapcats{
    position:absolute;top:10px;left:10px;right:54px;z-index:600;
    display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;
  }
  .mapcats::-webkit-scrollbar{display:none}
  .mapcats .chip{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.22);flex:none;padding:7px 12px}
  .mapcats .chip.on{background:var(--green);color:#fff}
  .mapcats .chip.on .ti{color:#fff}
  .mappane.off{display:none}
  #map{width:100%;height:100%}
  .listpane{flex:1;padding:14px 14px 90px;max-width:760px;width:100%;margin:0 auto}
  @media(min-width:900px){
    .split{flex-direction:row-reverse;align-items:flex-start}
    .mappane{flex:1;height:calc(100vh - 118px - env(safe-area-inset-top));position:sticky;top:calc(118px + env(safe-area-inset-top))}
    .listpane{width:46%;max-width:640px;flex:none;margin:0}
  }
  .plainwrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
  /* ===== stops list ===== */
  .nights-head{display:flex;align-items:center;gap:12px;margin:4px 2px 10px}
  .nights-head .bigdonut{width:52px;height:52px;border-radius:50%;position:relative;background:conic-gradient(var(--green) var(--p,0%), #e6ecf0 0);flex:none}
  .nights-head .bigdonut::after{content:attr(data-t);position:absolute;inset:5px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .nights-head .lbl{font-size:16px;font-weight:700}
  .tripstats{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 2px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tripstats .ti{font-size:15px}
  .stop{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px 14px 6px;position:relative;
  }
  .srow{display:flex;align-items:center;gap:12px}
  .stop .num{
    width:32px;height:32px;border-radius:50%;border:2px solid var(--green);color:var(--green);
    font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none;background:#fff;
  }
  .stop .mid{flex:1;min-width:0}
  .stop .mid h3{font-size:17px;font-weight:700}
  .stop .mid .dts{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;border:none;cursor:pointer;
    background:var(--bg);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--ink);
  }
  .chip .ti{font-size:14px}
  .chip.add{background:var(--green-soft);color:var(--green-ink)}
  .chip.sleep{background:var(--green-soft);color:var(--green-ink)}
  .chip.act{background:var(--amber-soft);color:#8a5a00}
  .stepper{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
  .stepper .row{display:flex;align-items:center;gap:6px}
  .stepper button{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:#fff;
    font-size:17px;cursor:pointer;color:var(--ink);line-height:1;
  }
  .stepper .n{font-size:19px;font-weight:700;min-width:24px;text-align:center}
  .stepper .lbl{font-size:10px;color:var(--muted);font-weight:700}
  .stop .kebab{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:5px 8px}
  /* openklapbare dagplanning per stop */
  .chev{width:100%;border:none;background:none;color:var(--muted);font-size:11.5px;font-weight:700;padding:8px 0 7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .stopdays{margin-top:8px;border-top:1px dashed var(--border);padding:6px 2px 2px}
  .dayrow{padding:7px 0;border-bottom:1px solid #f0f4f6}
  .dayrow:last-child{border-bottom:none}
  .dayrow-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700}
  .dayrow-head .dn{background:var(--green-soft);color:var(--green-ink);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800}
  .dayrow-head .addbtn{margin-left:auto;background:var(--green-soft);color:var(--green-ink);border:none;border-radius:99px;width:24px;height:24px;font-weight:800;cursor:pointer;font-size:13px;line-height:1}
  .mini{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:7px 10px;margin-top:6px;font-size:13px;font-weight:600}
  .mini.sleepbg{background:var(--green-soft);color:var(--green-ink)}
  .mini .t{color:var(--green-dark);font-weight:700;font-size:12px;min-width:36px;flex:none}
  .mini .ttl{flex:1;min-width:0;text-align:left;background:none;border:none;font:inherit;color:inherit;cursor:pointer;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini .sub{font-size:11.5px;color:var(--muted);font-weight:700;flex:none}
  .mini.sleepbg .sub{color:var(--green-ink);opacity:.75}
  .mini .mv{background:#fff;border:1px solid var(--border);border-radius:8px;width:26px;height:26px;cursor:pointer;color:var(--muted);font-size:13px;flex:none;font-weight:800}
  .mini-none{font-size:12px;color:var(--muted);margin-top:5px;font-style:italic}
  .leg{display:flex;align-items:center;gap:8px;padding:4px 10px}
  .leg::before,.leg::after{content:'';flex:1;border-top:1px dashed var(--border)}
  .legpill{
    display:inline-flex;align-items:center;gap:7px;background:var(--pink-soft);color:var(--pink);
    border:none;border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .legpill .ti{font-size:15px}
  .legpill .zap{color:#b7791f;display:inline-flex;align-items:center;gap:2px}
  .adddest{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    display:flex;align-items:center;gap:10px;padding:4px 14px;margin-top:12px;position:relative;
  }
  .adddest .ti{color:var(--muted);font-size:18px}
  .adddest input{flex:1;border:none;outline:none;padding:14px 0;font-size:15px;font-weight:600;background:none}
  .ac{
    position:absolute;top:100%;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(30,60,90,.18);
    z-index:600;overflow:hidden;margin-top:4px;display:none;
  }
  .ac.show{display:block}
  .ac button{
    display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    padding:11px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);
  }
  .ac button:last-child{border-bottom:none}
  .ac button small{display:block;color:var(--muted);font-size:12px;margin-top:1px;font-weight:500}
  .ac button:hover{background:var(--bg)}
  /* map markers */
  .mpin{
    width:32px;height:32px;border-radius:50%;background:#fff;color:var(--green);border:2.5px solid #fff;
    box-shadow:0 2px 7px rgba(0,0,0,.28);font-weight:700;font-size:14px;font-family:'Quicksand',sans-serif;
    display:flex;align-items:center;justify-content:center;
  }
  .mpin.bed{background:var(--col-hotel,#f59f00);color:#fff;font-size:16px}
  .apin{
    width:28px;height:28px;border-radius:9px;background:var(--col-act,#4263eb);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;
    border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);font-family:'Quicksand',sans-serif;
  }
  .pop-btn{
    display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
    border-radius:50%;border:none;background:var(--green-soft);color:var(--green-ink);
    cursor:pointer;font-size:18px;margin:8px 8px 0 0;
  }
  .modemark{
    width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .poi-pop{max-height:250px;overflow-y:auto;min-width:220px;font-family:'Quicksand',sans-serif}
  .poi-pop h4{font-size:13px;margin-bottom:6px}
  .poi-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #f0f3f5;font-size:12.5px}
  .poi-row>.ti{font-size:16px;color:var(--green-dark);flex:none}
  .poi-row .nm{flex:1;min-width:0}
  .poi-row .nm small{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-top:1px}
  .poi-row img{width:36px;height:36px;border-radius:8px;object-fit:cover;flex:none}
  .poi-row button{background:var(--green-soft);border:none;border-radius:99px;width:22px;height:22px;color:var(--green-ink);font-weight:700;cursor:pointer;flex:none}
  /* ===== cards / days ===== */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;position:relative}
  .card.tap{cursor:pointer;transition:transform .08s}
  .card.tap:active{transform:scale(.98)}
  .empty{text-align:center;color:var(--muted);padding:44px 24px;font-size:15px}
  .empty .big{font-size:44px;margin-bottom:12px;color:#c3cfd9}
  .day-head{display:flex;align-items:center;gap:8px;margin:20px 4px 10px;flex-wrap:wrap}
  .day-head .n{background:var(--green);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;flex:none}
  .day-head .d{font-weight:700;font-size:15px}
  .day-head .where{font-size:12px;color:var(--muted);font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .day-head .add{background:var(--green-soft);color:var(--green-ink);border:none;border-radius:99px;font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .act{display:flex;gap:12px}
  .act .time{color:var(--green-dark);font-weight:700;font-size:13px;flex:none;width:46px;padding-top:2px}
  .act .time .end{color:var(--muted);font-size:11px;font-weight:600}
  .act .body{flex:1;min-width:0}
  .act .body h4{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
  .act .body h4 .ti{color:var(--green-dark);font-size:16px;flex:none}
  .act .body .addr{font-size:13px;color:var(--muted);margin-top:3px;word-break:break-word}
  .act .body .note{font-size:13px;color:var(--muted);margin-top:3px;font-style:italic}
  .actph{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;cursor:pointer}
  .phrow{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch}
  .phrow img{height:130px;border-radius:12px;flex:none}
  .plc-line{font-size:14px;font-weight:600;margin-top:8px;display:flex;align-items:flex-start;gap:8px}
  .plc-line .ti{color:var(--green-dark);margin-top:2px;flex:none}
  .plc-line a{color:var(--green-dark)}
  .plc-hours{font-size:13px;color:var(--muted);font-weight:600;margin:2px 0 0 24px}
  .dep{
    margin-top:7px;font-size:12.5px;font-weight:700;color:var(--green-ink);
    background:var(--green-soft);border-radius:10px;padding:6px 10px;display:none;
  }
  .dep.show{display:block}
  .trav{text-align:center;font-size:12px;font-weight:700;color:var(--muted);margin:-4px 0 10px;display:none}
  /* reisschema */
  .sch{padding:0;overflow:hidden}
  .sch-dayhead{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .sch-dayhead:first-child{border-top:none}
  .sch-dayhead .dn{background:var(--green);color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;flex:none}
  .sch-dayhead b{font-size:14px}
  .sch-dayhead .addbtn{margin-left:auto;background:var(--green-soft);color:var(--green-ink);border:none;border-radius:99px;width:26px;height:26px;font-weight:800;cursor:pointer;font-size:13px}
  .sch-item{display:flex;align-items:center;gap:11px;padding:9px 14px 8px}
  .sch-item .sic{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
  .sch-item .ttl{flex:1;min-width:0;text-align:left;background:none;border:none;font:inherit;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0}
  .sch-item .grip{
    color:var(--muted);cursor:grab;touch-action:none;flex:none;
    padding:10px 12px;font-size:18px;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  .sch-item .grip:active{cursor:grabbing;color:var(--green-dark)}
  .sch-trav{display:flex;align-items:center;gap:10px;padding:3px 16px 3px 26px;font-size:13px;color:#5b6b7b;font-weight:700;font-variant-numeric:tabular-nums}
  .sch-trav .ti{font-size:15px;color:var(--muted)}
  .sch-trav .mid{flex:1;text-align:center;color:var(--muted)}
  .sch-none{padding:6px 14px 10px;font-size:12.5px;color:var(--muted);font-style:italic}
  .drag-ghost{position:fixed;z-index:900;opacity:.92;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:12px;pointer-events:none;padding:6px 10px;font-weight:700}
  .drop-line{position:absolute;height:3px;background:var(--green);z-index:890;border-radius:2px;pointer-events:none;box-shadow:0 0 0 2px rgba(47,190,143,.25)}
  .overlap{margin-top:5px;font-size:12px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:8px;padding:4px 9px;display:inline-block}
  .opens-tag{display:inline-block;font-size:11px;font-weight:700;background:var(--amber-soft);color:#8a5a00;border-radius:99px;padding:2px 8px;margin-top:4px}
  .maplink{display:inline-block;margin-top:6px;margin-right:6px;font-size:12px;font-weight:700;color:var(--green-dark);text-decoration:none;background:var(--green-soft);padding:4px 10px;border-radius:99px}
  .kebab{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:6px 10px}
  /* calendar */
  .cal-month{margin-bottom:18px}
  .cal-month h3{font-size:15px;font-weight:700;margin:0 2px 8px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-grid .wd{font-size:10px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
  .cal-cell{
    background:var(--card);border-radius:10px;min-height:52px;padding:5px 6px;font-size:12px;font-weight:700;
    box-shadow:var(--shadow);cursor:pointer;position:relative;
  }
  .cal-cell.blank{background:none;box-shadow:none;cursor:default}
  .cal-cell.out{opacity:.35;cursor:default}
  .cal-cell .sdot{position:absolute;left:6px;bottom:5px;right:6px;height:4px;border-radius:3px}
  .cal-cell .cnt{position:absolute;top:4px;right:5px;font-size:10px;background:var(--green-soft);color:var(--green-ink);border-radius:99px;padding:1px 6px}
  /* budget */
  .bud-total{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:14px;text-align:center}
  .bud-total .amt{font-size:32px;font-weight:800}
  .bud-total .lbl{font-size:13px;opacity:.9}
  .bud-cat{display:flex;justify-content:space-between;font-size:14px;padding:6px 2px}
  .bud-cat span{display:inline-flex;align-items:center;gap:7px}
  .bud-cat .ti{color:var(--green-dark)}
  .bud-cat b{font-variant-numeric:tabular-nums}
  .exp{display:flex;align-items:center;gap:10px}
  .exp .ic{font-size:19px;flex:none;color:var(--green-dark)}
  .exp .body{flex:1;min-width:0}
  .exp .body h4{font-size:14px;font-weight:700}
  .exp .body .sub2{font-size:12px;color:var(--muted)}
  .exp .amt{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  /* lists */

/* ================= HELPERS ================= */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtD(iso){ if(!iso) return ''; const d=new Date(iso+'T12:00'); return d.getDate()+' '+MND[d.getMonth()]; }
function fmtDY(iso){ if(!iso) return ''; const d=new Date(iso+'T12:00'); return d.getDate()+' '+MND[d.getMonth()]+' '+d.getFullYear(); }
function fmtDagLang(iso){ const d=new Date(iso+'T12:00'); return DAG[d.getDay()]+' '+d.getDate()+' '+MND[d.getMonth()]; }
function fmtKort(iso){ if(!iso) return '—'; const d=new Date(iso+'T12:00'); return DAGK[d.getDay()]+' '+d.getDate()+' '+MND[d.getMonth()]; }
function eur(n){ return '€ '+(Math.round(n*100)/100).toLocaleString('nl-BE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function addDays(iso,n){ const d=new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysOf(t){
  const out=[]; if(!t.start_date||!t.end_date) return out;
  let d=t.start_date;
  while(d<=t.end_date && out.length<120){ out.push(d); d=addDays(d,1); }
  return out;
}
function hmToMin(hm){ if(!hm) return null; const p=hm.split(':'); return (+p[0])*60+(+p[1]); }
function minToHm(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.round(m%60)).padStart(2,'0'); }
function durTxt(min){ min=Math.round(min); return min>=60 ? Math.floor(min/60)+'u'+String(min%60).padStart(2,'0') : min+' min'; }
function mapsUrl(a){ return 'https://maps.apple.com/?q='+encodeURIComponent(a); }
function gmapsUrl(a){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a); }
function dirUrl(a,b){ return 'https://www.google.com/maps/dir/?api=1&origin='+a.lat+','+a.lng+'&destination='+b.lat+','+b.lng; }
function havKm(a,b){
  const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function tripIcon(t){

function status(t){

    const diff=Math.ceil((new Date(t.start_date)-new Date(now))/86400000);
    if(diff<=45) return ['soon','Over '+diff+(diff===1?' dag':' dagen')];
  }
  return [null,null];
}
function norm(t){
  t.data=t.data||{};
  ['stops','acts','hotels','todos','pack','exps'].forEach(k=>{ if(!Array.isArray(t.data[k])) t.data[k]=[]; });

}

function plannedNights(t){ return t.data.stops.reduce((s,x)=>s+(x.nights||0),0); }
function hotelNights(h){ if(!h.cin||!h.cout) return 0; return Math.max(0,Math.round((new Date(h.cout)-new Date(h.cin))/86400000)); }
/* datumbereik per stop: aankomst = start + som nachten ervoor */
function stopRanges(t){
  const out=[]; let cursor=t.start_date||null;
  t.data.stops.forEach(s=>{
    const from=cursor;
    const to=(cursor&&s.nights>0)?addDays(cursor,s.nights):cursor;
    out.push({stop:s,from,to});
    cursor=to;
  });
  return out;
}
function rangeDays(r){
  if(!r.from) return [];
  const out=[]; let d=r.from;
  const last=(r.stop.nights>0)?addDays(r.from,r.stop.nights-1):r.from;
  while(d<=last){ out.push(d); d=addDays(d,1); }
  return out;
}
function actsForRange(t,r){ const ds=rangeDays(r); return t.data.acts.filter(a=>ds.includes(a.day)); }
function hotelsForStop(t,r){
  return t.data.hotels.filter(h=> h.stopId===r.stop.id || (!h.stopId && h.cin && r.from && h.cin>=r.from && h.cin<(r.to||r.from)) );
}
function hotelForDay(t,day){
  const rs=stopRanges(t);
  for(const r of rs){
    const ds=rangeDays(r);
    if(ds.includes(day)){ const hs=hotelsForStop(t,r); if(hs.length) return hs[0]; }
  }
  return t.data.hotels.find(h=>h.cin&&h.cout&&h.cin<=day&&day<=h.cout)||null;
}
/* waar slaap je die nacht? Echt hotel, of anders een placeholder in het centrum van de bestemming */
function sleepPointForDay(t,day){
  const rs=stopRanges(t);
  for(const r of rs){
    if(r.stop.nights>0&&rangeDays(r).includes(day)){
      const hs=hotelsForStop(t,r);
      if(hs.length&&hs[0].lat!=null) return {lat:hs[0].lat,lng:hs[0].lng,name:hs[0].name,addr:hs[0].addr,hotel:hs[0],key:'h'+hs[0].id};

  }

  return null;
}

async function loadTrips(){
  const [{data,error},{data:mem}]=await Promise.all([
    sb.from('trips').select('*').order('start_date',{ascending:true,nullsFirst:false}),

  memberships={}; (mem||[]).forEach(x=>memberships[x.trip_id]=x.role);
  trips=(data||[]).map(norm);
  if(cur){ const f=trips.find(x=>x.id===cur.id); if(f){ f._members=cur._members; cur=f; } else cur=null; }
}
async function pushData(){
  if(!canEdit(cur)) return;
  const {error}=await sb.from('trips').update({data:cur.data, updated_at:new Date().toISOString()}).eq('id',cur.id);
  if(error) alert('Opslaan mislukt: '+error.message);
}

function subRealtime(){
  if(RT) return;
  RT=sb.channel('rt-trips')
    .on('postgres_changes',{event:'*',schema:'public',table:'trips'},()=>{
      if(!document.getElementById('overlay').classList.contains('show')) refresh();

}

function navTo(lat,lng,label){
  if(lat==null){ alert('Geen locatie bekend voor deze plek.'); return; }
  const nav=SETTINGS.nav||'google';

      navigator.share({title:label||'Bestemming',text:label||'Bestemming',url:'https://www.google.com/maps/search/?api=1&query='+lat+','+lng}).catch(()=>{});

    }
    return;
  }
  window.open('https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng,'_blank');
}

function authMsg(t){ const el=document.getElementById('authMsg'); el.textContent=t; el.classList.add('show'); }
async function doAuth(){
  const email=document.getElementById('a_email').value.trim();
  const pass=document.getElementById('a_pass').value;
  if(!email||pass.length<6){ authMsg('Vul je e-mail in en een wachtwoord van minstens 6 tekens.'); return; }
  document.getElementById('authBtn').disabled=true;
  try{
    if(authMode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pass});
      if(error) throw error;
      if(!data.session){ authMsg('Bijna klaar! Bevestig je account via de link in je mailbox en log daarna in.'); authMode='login'; return; }
      user=data.session.user;
    } else {
      const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
      user=data.user;
    }
    await afterLogin();
  }catch(e){ authMsg(vertaalFout(e.message)); }
  finally{ const b=document.getElementById('authBtn'); if(b) b.disabled=false; }
}
function vertaalFout(msg){
  if(/invalid login/i.test(msg)) return 'Onjuist e-mailadres of wachtwoord.';
  if(/already registered/i.test(msg)) return 'Dit e-mailadres heeft al een account.';
  if(/rate limit/i.test(msg)) return 'Te veel pogingen, probeer zo dadelijk opnieuw.';
  return msg;
}

  try{ await sb.rpc('claim_invites'); }catch(e){}
  await loadTrips(); subRealtime();

async function pickPlace(i){

  cur.data.stops.push({id:uid(),name:p.name||p.display_name.split(',')[0],display:p.display_name,lat:+p.lat,lng:+p.lon,nights:1});

}

/* --- stop bewerken --- */
let stopTimer=null, STOPRES=[], STOPPICK=null;
function stopInput(v){
  clearTimeout(stopTimer); STOPPICK=null;
  if(v.trim().length<2){ const el=document.getElementById('stopAc'); if(el){el.classList.remove('show');el.innerHTML='';} return; }
  stopTimer=setTimeout(async ()=>{
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=nl&q='+encodeURIComponent(v.trim()));
      STOPRES=await r.json();
      const el=document.getElementById('stopAc'); if(!el) return;
      if(!STOPRES.length){ el.classList.remove('show'); el.innerHTML=''; return; }
      el.innerHTML=STOPRES.map((p,i)=>'<button onclick="pickStopPlace('+i+')">'+esc(p.name||p.display_name.split(',')[0])+'<small>'+esc(p.display_name)+'</small></button>').join('');
      el.classList.add('show');
    }catch(e){}
  },350);
}
function pickStopPlace(i){
  const p=STOPRES[i]; if(!p) return;
  STOPPICK={name:p.name||p.display_name.split(',')[0],display:p.display_name,lat:+p.lat,lng:+p.lon};
  document.getElementById('f_sname').value=STOPPICK.name;
  const el=document.getElementById('stopAc'); if(el){el.classList.remove('show');el.innerHTML='';}
}
function sheetStop(id){
  const s=cur.data.stops.find(x=>x.id===id);
  const i=cur.data.stops.indexOf(s);
  STOPPICK=null; STOPRES=[];
  openSheet('<h2>'+ic('map-pin')+' Bestemming</h2>'+
    '<div class="field" style="position:relative"><label>Naam (zoek om de locatie te wijzigen)</label><input id="f_sname" autocomplete="off" oninput="stopInput(this.value)" value="'+esc(s.name)+'"><div class="ac" id="stopAc"></div></div>'+
    '<div class="field" style="display:flex;align-items:center;gap:10px"><input type="checkbox" id="f_shome" style="width:20px;height:20px;accent-color:var(--green);flex:none" '+(s.isHome?'checked':'')+'>'+
    '<span style="font-size:14px;font-weight:600">Dit is thuis — vertrek- of eindpunt, telt niet mee als bestemming</span></div>'+
    '<div class="btns" style="margin-top:6px">'+
      (i>0?'<button class="btn ghost" onclick="moveStop(\''+id+'\',-1)">'+ic('arrow-up')+' Vroeger</button>':'')+
      (i<cur.data.stops.length-1?'<button class="btn ghost" onclick="moveStop(\''+id+'\',1)">'+ic('arrow-down')+' Later</button>':'')+
    '</div>'+
    '<div class="btns"><button class="btn danger" onclick="delStop(\''+id+'\')">'+ic('trash')+'</button>'+
    '<button class="btn ghost" onclick="closeSheet()">Annuleer</button>'+
    '<button class="btn primary" onclick="saveStop(\''+id+'\')">Bewaar</button></div>');
}
async function saveStop(id){
  const s=cur.data.stops.find(x=>x.id===id);
  const nm=document.getElementById('f_sname').value.trim();
  if(nm) s.name=nm;
  if(STOPPICK){ s.lat=STOPPICK.lat; s.lng=STOPPICK.lng; s.display=STOPPICK.display; }
  const wasHome=!!s.isHome;
  s.isHome=document.getElementById('f_shome').checked;
  if(s.isHome){
    s.nights=0;
    if(s.lat!=null){ SETTINGS.home={name:s.name,lat:s.lat,lng:s.lng}; localStorage.setItem('travai_settings',JSON.stringify(SETTINGS)); }
  } else if(wasHome){ delete s.isHome; }
  await pushData(); closeSheet(); render();
}
/* bewaard thuisadres als vertrek- of eindpunt toevoegen */
async function addHome(where){
  if(!SETTINGS.home) return;
  const st={id:uid(),name:SETTINGS.home.name,lat:SETTINGS.home.lat,lng:SETTINGS.home.lng,nights:0,isHome:true};
  if(where==='start') cur.data.stops.unshift(st); else cur.data.stops.push(st);
  await pushData(); render();
}
async function moveStop(id,d){
  const a=cur.data.stops; const i=a.findIndex(x=>x.id===id); const j=i+d;
  if(j<0||j>=a.length) return;
  [a[i],a[j]]=[a[j],a[i]];
  await pushData(); closeSheet(); render();
}
async function delStop(id){
  if(!confirm('Deze bestemming verwijderen?')) return;
  cur.data.stops=cur.data.stops.filter(x=>x.id!==id);
  cur.data.hotels.forEach(h=>{ if(h.stopId===id) delete h.stopId; });
  await pushData(); closeSheet(); render();
}

/* ================= KAART ================= */
function mountMap(){
  const el=document.getElementById('map'); if(!el) return;
  if(MAP){ MAP.remove(); MAP=null; }
  MAP=L.map('map',{zoomControl:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    attribution:'© OpenStreetMap, © CARTO', maxZoom:19
  }).addTo(MAP);
  ROUTELAYER=L.layerGroup().addTo(MAP);
  const pts=[];
  const rs=stopRanges(cur);
  let num=0;
  rs.forEach((r,i)=>{
    const s=r.stop; if(s.lat==null) return;
    pts.push([s.lat,s.lng]);
    if(!s.isHome) num++;
    const editBtn=canEdit(cur)?'<br><button class="maplink" style="border:none;cursor:pointer;margin-top:6px" onclick="sheetStop(\''+s.id+'\')">'+ic('pencil')+' Bewerken</button>':'';
    L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:'<div class="mpin" style="color:'+STOPCOLORS[i%STOPCOLORS.length]+';font-size:17px">'+(s.isHome?ic('home'):ic('map-pin'))+'</div>',iconSize:[32,32],iconAnchor:[16,16]}),title:s.name})
      .addTo(MAP).bindPopup('<b>'+esc(s.name)+'</b><br>'+(r.from?fmtKort(r.from)+(s.isHome?' · thuis':(s.nights>0?' – '+fmtKort(r.to):' · tussenstop')):'')+editBtn);
    hotelsForStop(cur,r).forEach(hx=>{
      if(hx.lat!=null) L.marker([hx.lat,hx.lng],{icon:L.divIcon({className:'',html:'<div class="mpin bed">'+ic('bed')+'</div>',iconSize:[32,32],iconAnchor:[16,16]})})
        .addTo(MAP).bindPopup('<b>'+esc(hx.name)+'</b>'+(hx.addr?'<br>'+esc(hx.addr):'')+
          (canEdit(cur)?'<br><button class="maplink" style="border:none;cursor:pointer;margin-top:6px" onclick="sheetHotel(\''+hx.id+'\')">'+ic('pencil')+' Bewerken</button>':''));
    });
  });
  cur.data.acts.forEach(a=>{
    if(a.lat==null) return;
    const icn=(ACT_TYPES[a.type]||ACT_TYPES.act)[0];
    L.marker([a.lat,a.lng],{icon:L.divIcon({className:'',html:'<div class="apin">'+ic(icn)+'</div>',iconSize:[28,28],iconAnchor:[14,14]}),title:a.title})
      .addTo(MAP).on('click',()=>sheetPlace(a.id));
  });
  /* kaartpositie behouden bij her-renderen (bv. na activiteit toevoegen) */
  if(MAPVIEW){ MAP.setView(MAPVIEW.c,MAPVIEW.z); }
  else if(pts.length){ MAP.fitBounds(L.latLngBounds(pts).pad(0.25)); }
  else { MAP.setView([50.85,4.35],6); }
  MAP.on('moveend',()=>{ if(MAP) MAPVIEW={c:MAP.getCenter(),z:MAP.getZoom()}; });
  SEARCHLAYER=L.layerGroup().addTo(MAP);
  renderCatBar();
  if(CATACTIVE&&CATRES.length) drawCatMarkers(CATACTIVE); /* zoekresultaten blijven staan */
  drawRoute();
  MAP.on('click',e=>poiLookup(e.latlng));
}

function clearCat(){ CATACTIVE=null; if(SEARCHLAYER) SEARCHLAYER.clearLayers(); renderCatBar(); }
async function catSearch(k){
  if(!MAP) return;
  if(CATACTIVE===k){ clearCat(); return; }
  CATACTIVE=k; renderCatBar();
  if(SEARCHLAYER) SEARCHLAYER.clearLayers();
  const c=MAP.getCenter(), b=MAP.getBounds();
  const diagKm=havKm({lat:b.getNorth(),lng:b.getWest()},{lat:b.getSouth(),lng:b.getEast()});
  const radius=Math.min(30000,Math.max(600,diagKm*1000/2.6));
  const cat=MAP_CATS[k];
  CATRES=[];
  if(GMAPS_KEY){
    try{
      const r=await fetch('https://places.googleapis.com/v1/places:searchNearby',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-Goog-Api-Key':GMAPS_KEY,
          'X-Goog-FieldMask':'places.id,places.displayName,places.location,places.formattedAddress,places.rating,places.userRatingCount,places.internationalPhoneNumber,places.primaryType,places.photos'},
        body:JSON.stringify({includedTypes:cat[2],maxResultCount:20,languageCode:'nl',rankPreference:'POPULARITY',
          locationRestriction:{circle:{center:{latitude:c.lat,longitude:c.lng},radius:Math.round(radius)}}})
      });
      const js=await r.json();
      CATRES=(js.places||[]).map(p=>({
        name:p.displayName&&p.displayName.text, lat:p.location&&p.location.latitude, lng:p.location&&p.location.longitude,
        addr:p.formattedAddress, rating:p.rating, ratings:p.userRatingCount, tel:p.internationalPhoneNumber,
        kind:p.primaryType, gpid:p.id,
        photo:(p.photos&&p.photos[0])?'https://places.googleapis.com/v1/'+p.photos[0].name+'/media?maxWidthPx=240&key='+GMAPS_KEY:null
      })).filter(p=>p.name&&p.lat!=null);
    }catch(e){ CATRES=[]; }
  }
  if(!CATRES.length){
    try{
      const q='[out:json][timeout:12];('+CAT_OVERPASS[k].replace(/R/g,String(Math.min(9000,Math.round(radius)))).replace(/LAT/g,c.lat).replace(/LNG/g,c.lng)+');out center 20;';
      const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});
      const js=await r.json();
      CATRES=(js.elements||[]).map(e=>({
        name:(e.tags&&e.tags.name)||cat[1], lat:e.lat||(e.center&&e.center.lat), lng:e.lon||(e.center&&e.center.lon),

      })).filter(p=>p.lat!=null).slice(0,20);

function drawRoute(){
  if(!MAP||!ROUTELAYER) return;
  ROUTELAYER.clearLayers();
  const ss=cur.data.stops;
  for(let i=1;i<ss.length;i++){
    const a=ss[i-1], b=ss[i], mode=b.mode||'car';
    if(a.lat==null||b.lat==null) continue;
    const st=MODE_STYLE[mode]||MODE_STYLE.car;
    let drawn=false;
    const g=LEGGEOM[b.id];
    if(g){ L.geoJSON(g,{style:{color:st.color,weight:3.5,opacity:.85,dashArray:st.dash||null}}).addTo(ROUTELAYER); drawn=true; }
    if(!drawn){
      L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:st.color,weight:3,dashArray:st.dash||'7 7',opacity:.8}).addTo(ROUTELAYER);
    }
    if(mode!=='car'){
      const mid=[(a.lat+b.lat)/2,(a.lng+b.lng)/2];
      L.marker(mid,{icon:L.divIcon({className:'',html:'<div class="modemark" style="color:'+st.color+'">'+ic(MODES[mode][0])+'</div>',iconSize:[28,28],iconAnchor:[14,14]}),interactive:false}).addTo(ROUTELAYER);
    }
  }
}

/* ================= ETAPPES (routering + voertuig) ================= */
const LEGGEOM={}; /* getekende routegeometrie per etappe (id van de aankomststop) */
function legKey(a,b,mode){ return a.lat+','+a.lng+';'+b.lat+','+b.lng+';'+mode; }
async function osrmVia(pts,prof){
  const key=pts.map(p=>p.lat+','+p.lng).join(';')+';'+prof;
  if(LEGCACHE[key]) return LEGCACHE[key];
  const path=prof==='foot'?'routed-foot':prof==='bike'?'routed-bike':'routed-car';
  try{
    const coords=pts.map(p=>p.lng+','+p.lat).join(';');
    const r=await fetch('https://routing.openstreetmap.de/'+path+'/route/v1/driving/'+coords+'?overview=full&geometries=geojson');
    const js=await r.json();
    if(js.code!=='Ok'||!js.routes||!js.routes[0]) throw 0;
    const rt=js.routes[0];
    LEGCACHE[key]={km:rt.distance/1000, min:rt.duration/60, geometry:rt.geometry};
  }catch(e){
    /* terugval: hemelsbreed ×1.25 */
    let km=0; for(let i=1;i<pts.length;i++) km+=havKm(pts[i-1],pts[i]);
    km*=1.25;
    LEGCACHE[key]={km, min:prof==='foot'?km/4.5*60:prof==='bike'?km/16*60:km/80*60, geometry:null, est:true};
  }
  return LEGCACHE[key];
}
function osrm(a,b,prof){ return osrmVia([a,b],prof); }
/* activiteiten op de reisdag die onderweg liggen → automatische routepunten */
function legWaypoints(a,b,travelDay){
  if(!travelDay||!cur||a.lat==null||b.lat==null) return [];
  const k=Math.cos((a.lat+b.lat)/2*Math.PI/180);
  const dx=(b.lng-a.lng)*k, dy=b.lat-a.lat;
  const len2=dx*dx+dy*dy; if(!len2) return [];
  return sortActs(cur.data.acts.filter(x=>x.day===travelDay&&x.lat!=null))
    .map(x=>({x, t:(((x.lng-a.lng)*k)*dx+(x.lat-a.lat)*dy)/len2}))
    .filter(o=>o.t>0.03&&o.t<0.97)
    .sort((p,q)=>p.t-q.t).slice(0,6).map(o=>o.x);
}
/* reisinfo per vervoermiddel, optioneel via tussenliggende activiteiten */
async function legInfo(a,b,mode,via){
  mode=mode||'car'; via=via||[];
  const pts=[a,...via,b];
  if(mode==='car'||mode==='foot'||mode==='bike') return osrmVia(pts,mode==='car'?'car':mode);
  if(mode==='moto'||mode==='taxi') return osrmVia(pts,'car');
  if(mode==='bus'){ const c=await osrmVia(pts,'car'); return {km:c.km,min:c.min*1.45,geometry:c.geometry,est:true}; }
  const km=havKm(a,b); let min=km/(MODE_SPEED[mode]||80)*60;
  if(mode==='plane') min+=60; /* taxiën, klimmen, landen — excl. inchecken */
  return {km,min,est:true};
}
function chargeStops(km,mode){
  if(mode!=='car'||SETTINGS.veh!=='ev') return 0;
  return Math.max(0,Math.ceil(km/(+SETTINGS.range||330))-1);
}
async function computeLegs(){
  const ss=cur?cur.data.stops:[];
  const rs=cur?stopRanges(cur):[];
  let totKm=0, totMin=0, totCh=0, any=false;
  for(let i=1;i<ss.length;i++){
    const a=ss[i-1], b=ss[i], mode=b.mode||'car';
    const el=document.getElementById('leg-'+b.id);
    if(a.lat==null||b.lat==null){ if(el) el.innerHTML=ic('map-pin')+' locatie onbekend'; continue; }
    const wp=(mode==='plane'||mode==='boat'||mode==='train')?[]:legWaypoints(a,b,rs[i]&&rs[i].from);
    const c=await legInfo(a,b,mode,wp);
    if(!cur) return;
    LEGGEOM[b.id]=c.geometry||null;
    const n=chargeStops(c.km,mode);
    totKm+=c.km; totMin+=c.min+n*SETTINGS.charge; totCh+=n; any=true;
    const el2=document.getElementById('leg-'+b.id);
    if(el2) el2.innerHTML=ic(MODES[mode][0])+' '+durTxt(c.min+n*SETTINGS.charge)+' · '+Math.round(c.km)+' km'+(wp.length?' · via '+wp.length:'')+(n?' <span class="zap">'+ic('bolt')+n+'</span>':'')+(c.est?' ≈':'');
    drawRoute();
  }
  const st=document.getElementById('tripstats');
  const nLegs=ss.filter((s,i)=>i>0&&s.lat!=null&&ss[i-1].lat!=null).length;
  if(st&&any) st.innerHTML=ic('route')+' Hele reis: '+Math.round(totKm)+' km · '+durTxt(totMin)+' rijden, gespreid over '+nLegs+' etappes'+(totCh?' · '+ic('bolt')+totCh+' laadstop'+(totCh>1?'s':''):'');
}

function dayRouteUrl(d,acts){
  const pts=(acts||cur.data.acts.filter(a=>a.day===d)).filter(a=>a.lat!=null).map(a=>a.lat+','+a.lng);
  if(!pts.length) return null;
  const hot=sleepPointForDay(cur,addDays(d,-1))||sleepPointForDay(cur,d);
  let origin, route;
  if(hot&&hot.lat!=null){ origin=hot.lat+','+hot.lng; route=pts; }
  else if(pts.length>1){ origin=pts[0]; route=pts.slice(1); }
  else return null;
  const dest=route[route.length-1];
  const wps=route.slice(0,-1).join('|');
  return 'https://www.google.com/maps/dir/?api=1&origin='+origin+'&destination='+dest+(wps?'&waypoints='+encodeURIComponent(wps):'');
}

/* ================= REISSCHEMA (versleepbaar) ================= */
function schemaPoints(d){
  const t=cur, days=daysOf(t), di=days.indexOf(d);
  const pts=[];
  const prevSleep=sleepPointForDay(t,addDays(d,-1));
  if(prevSleep){
    pts.push({kind:'hotel',label:prevSleep.name+(prevSleep.placeholder?' (nog geen hotel)':''),icon:'bed',lat:prevSleep.lat,lng:prevSleep.lng,hotel:prevSleep.hotel,phStop:prevSleep.stop,key:prevSleep.key,color:prevSleep.placeholder?'#a0aab4':SETTINGS.colHotel});
  } else if(di===0&&t.data.stops.length){
    const s=t.data.stops[0];
    pts.push({kind:'start',label:s.name,icon:s.isHome?'home':'flag',lat:s.lat,lng:s.lng,stop:s,color:SETTINGS.colStart});
  } else {
    const r=stopRanges(t).find(rr=>rangeDays(rr).includes(d));
    if(r&&r.stop.lat!=null) pts.push({kind:'start',label:r.stop.name,icon:'map-pin',lat:r.stop.lat,lng:r.stop.lng,stop:r.stop,color:SETTINGS.colStart});
  }
  sortActs(t.data.acts.filter(a=>a.day===d)).forEach(a=>pts.push({kind:'act',label:a.title,icon:(ACT_TYPES[a.type]||ACT_TYPES.act)[0],lat:a.lat,lng:a.lng,act:a,color:SETTINGS.colAct}));
  const ton=sleepPointForDay(t,d);
  if(ton&&!(pts[0]&&pts[0].key===ton.key)){
    pts.push({kind:'hotel',label:ton.name+(ton.placeholder?' (nog geen hotel)':''),icon:'bed',lat:ton.lat,lng:ton.lng,hotel:ton.hotel,phStop:ton.stop,key:ton.key,color:ton.placeholder?'#a0aab4':SETTINGS.colHotel});
  } else if(!ton){
    /* reisdag zonder hotel op de bestemming (bv. thuis of tussenstop als eindpunt): toon de aankomststop als eindpunt */
    const rsArr=stopRanges(t);
    const idx=rsArr.findIndex(r=>r.from===d);
    if(idx>0){
      const s=rsArr[idx].stop;
      if(s.lat!=null&&!(pts[0]&&pts[0].stop===s))
        pts.push({kind:'end',label:s.name,icon:s.isHome?'home':'map-pin',lat:s.lat,lng:s.lng,stop:s,color:SETTINGS.colStart});
    }
  }
  return pts;
}

/* tijden en afstanden in het schema doorrekenen */
async function computeSchema(){
  if(!cur) return;
  for(const d of daysOf(cur)){
    const pts=schemaPoints(d);
    let cursor=null, dayKm=0, dayMin=0, hops=0;
    for(let i=1;i<pts.length;i++){
      const A=pts[i-1], B=pts[i];
      const el=document.getElementById('trs-'+d+'-'+i);
      if(A.lat==null||B.lat==null){ if(el) el.querySelector('.mid').textContent='locatie onbekend'; continue; }
      const tm=travModeOf(B);
      const c=await osrm(A,B,tm);
      if(!cur||!(tab==='route'&&routeMode==='micro')) return;
      dayKm+=c.km; dayMin+=c.min; hops++;
      const tmin=Math.ceil(c.min);
      const bt=B.act?hmToMin(B.act.time):null;
      let dep = cursor!=null ? cursor : (bt!=null ? bt-tmin : hmToMin('09:00'));
      const arr = bt!=null ? bt : dep+tmin;
      if(B.act){
        const s=hmToMin(B.act.time), e=hmToMin(B.act.end);
        const visit=(s!=null&&e!=null&&e>s)?e-s:60;
        cursor=(e!=null)?e:arr+visit;
      } else cursor=arr;
      const el2=document.getElementById('trs-'+d+'-'+i);
      if(el2){
        const modeName={car:'auto',foot:'te voet',bike:'fiets'}[tm];
        const unreal=(tm==='foot'&&c.km>25)||(tm==='bike'&&c.km>120);
        el2.querySelector('.t1').textContent=minToHm(dep);
        el2.querySelector('.mid').innerHTML=modeName+' · '+(Math.round(c.km*10)/10)+' km / '+durTxt(c.min)+(c.est?' ≈':'')+
          (unreal?' <span style="color:var(--red)">· onrealistisch, tik voor auto</span>':'');
        el2.querySelector('.t2').textContent=minToHm(arr);
      }
    }
    const tot=document.getElementById('dtot-'+d);
    if(tot&&hops) tot.textContent='· '+(Math.round(dayKm*10)/10)+' km · '+durTxt(dayMin)+' onderweg';
  }
}
/* slepen met muis of vinger (via het grip-icoon) */
let DRAG=null;
function gripDown(e,actId){
  e.preventDefault(); e.stopPropagation();
  const src=e.target.closest('.sch-item');
  try{ e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId); }catch(err){}
  const rows=[...document.querySelectorAll('.sch-item[data-act],.sch-dayhead,.sch-none')].map(el=>({el,rect:el.getBoundingClientRect()}));
  const g=document.createElement('div'); g.className='drag-ghost'; g.textContent=src?src.querySelector('.ttl').textContent:'…';
  document.body.appendChild(g);
  const l=document.createElement('div'); l.className='drop-line'; document.body.appendChild(l);
  DRAG={actId,rows,ghost:g,line:l,target:null,before:false};
  document.body.style.userSelect='none';
  dragMove(e);
}
document.addEventListener('pointermove',e=>{ if(DRAG){ e.preventDefault(); dragMove(e); } },{passive:false});
document.addEventListener('pointerup',()=>{ if(DRAG) dragEnd(); });
document.addEventListener('pointercancel',()=>{
  if(DRAG){ DRAG.ghost.remove(); DRAG.line.remove(); DRAG=null; document.body.style.userSelect=''; }
});
function dragMove(e){
  DRAG.ghost.style.left=(e.clientX+12)+'px'; DRAG.ghost.style.top=(e.clientY-14)+'px';
  let best=null,bd=1e9;
  DRAG.rows.forEach(r=>{ const mid=(r.rect.top+r.rect.bottom)/2; const dl=Math.abs(e.clientY-mid); if(dl<bd){bd=dl;best=r;} });
  DRAG.target=best;
  if(best){
    DRAG.before=e.clientY<(best.rect.top+best.rect.bottom)/2;
    DRAG.line.style.top=((DRAG.before?best.rect.top:best.rect.bottom)+window.scrollY)+'px';
    DRAG.line.style.left=(best.rect.left+window.scrollX)+'px';
    DRAG.line.style.width=best.rect.width+'px';
  }
}
async function dragEnd(){
  const D=DRAG; DRAG=null;
  D.ghost.remove(); D.line.remove();
  document.body.style.userSelect='';
  if(!D.target) return;
  const a=cur.data.acts.find(x=>x.id===D.actId); if(!a) return;
  const day=D.target.el.dataset.day; if(!day) return;
  const isHead=!D.target.el.dataset.act;
  const targetActId=D.target.el.dataset.act;
  if(targetActId===a.id) return;
  a.day=day;
  const list=sortActs(cur.data.acts.filter(x=>x.day===day&&x.id!==a.id));
  let pos=isHead?0:list.findIndex(x=>x.id===targetActId);
  if(pos<0) pos=list.length; else if(!D.before) pos+=1;
  list.splice(pos,0,a);
  list.forEach((x,i)=>x.seq=i);
  /* tijd meeschuiven naar de nieuwe plek; duur blijft behouden */
  const above=pos>0?list[pos-1]:null, below=pos<list.length-1?list[pos+1]:null;
  const dur=(hmToMin(a.time)!=null&&hmToMin(a.end)!=null)?hmToMin(a.end)-hmToMin(a.time):null;
  const ae=above?(hmToMin(above.end)!=null?hmToMin(above.end):hmToMin(above.time)):null;
  const bt=below?hmToMin(below.time):null;
  let nt=null;
  if(ae!=null) nt=ae+30; else if(bt!=null) nt=Math.max(0,bt-((dur||60)+30));
  if(nt!=null){ a.time=minToHm(nt); if(dur!=null) a.end=minToHm(nt+dur); }
  await pushData(); render();
}

let DMAP=null;
function dayPoints(d){
  return schemaPoints(d).filter(p=>p.lat!=null);
}
function mountDayMap(d){
  const el=document.getElementById('dmap'); if(!el) return;
  if(DMAP){ DMAP.remove(); DMAP=null; }
  const pts=dayPoints(d); if(!pts.length) return;
  DMAP=L.map('dmap',{zoomControl:false,attributionControl:false});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(DMAP);
  let n=0;
  pts.forEach(p=>{

    else if(p.kind==='start'||p.kind==='end') html='<div class="mpin" style="color:'+SETTINGS.colStart+';font-size:16px">'+ic(p.icon)+'</div>';
    else html='<div class="apin" style="width:30px;height:30px">'+(++n)+'</div>';
    const mk=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html,iconSize:[32,32],iconAnchor:[16,16]}),title:p.label}).addTo(DMAP);
    if(p.act) mk.on('click',()=>sheetPlace(p.act.id));
    else mk.bindPopup('<b>'+esc(p.label)+'</b>'+
      (canEdit(cur)?(p.hotel?'<br><button class="pop-btn" title="Bewerken" onclick="sheetHotel(\''+p.hotel.id+'\')">'+ic('pencil')+'</button>':
        (p.phStop?'<br><button class="pop-btn" title="Hotel kiezen" onclick="sheetHotel(null,\''+p.phStop.id+'\')">'+ic('plus')+'</button>':'')):''));
  });
  DMAP.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])).pad(0.3));
  drawDayRoutes(pts);
}
async function drawDayRoutes(pts){
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i];
    const tm=travModeOf(b);
    const prof=tm!=='car'?tm:(havKm(a,b)<=8?'foot':'car'); /* korte afstand standaard te voet */
    const c=await osrm(a,b,prof);
    if(!DMAP) return;
    const col=prof==='foot'?'#1e9e74':prof==='bike'?'#2f9e44':'#e8467c';
    if(c.geometry) L.geoJSON(c.geometry,{style:{color:col,weight:3,opacity:.8,dashArray:prof==='car'?null:'2 7'}}).addTo(DMAP);
    else L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:'#8296a8',weight:2,dashArray:'6 6'}).addTo(DMAP);
  }
}
function dayShift(n){
  const days=daysOf(cur); const i=days.indexOf(dayView);
  const j=Math.min(days.length-1,Math.max(0,i+n));
  dayView=days[j]; render(); window.scrollTo(0,0);

async function computeDepartures(){
  if(!cur) return;
  for(const a of cur.data.acts){
    const target=a.opens||a.time;
    if(!target||a.lat==null||!a.day) continue;
    const hot=sleepPointForDay(cur,addDays(a.day,-1))||sleepPointForDay(cur,a.day);
    if(!hot||hot.lat==null) continue;
    const c=await osrm(hot,a,'car');
    const el=document.getElementById('dep-'+a.id);
    if(!el) continue;
    const dep=hmToMin(target)-Math.ceil(c.min)-BUFFER_MIN;
    el.innerHTML=ic('car')+' Vanaf '+esc(hot.name)+(hot.placeholder?' (nog geen hotel)':'')+': '+durTxt(c.min)+' rijden'+(c.est?' (≈)':'')+' → <b>vertrek uiterlijk '+minToHm(dep)+'</b>';
    el.classList.add('show');
    if(c.km<=6){
      const ft=await osrm(hot,a,'foot');
      const dep2=hmToMin(target)-Math.ceil(ft.min)-BUFFER_MIN;
      el.innerHTML+='<br>'+ic('walk')+' Of te voet: '+durTxt(ft.min)+' → vertrek '+minToHm(dep2);
    }
  }

async function computeTravel(){
  if(!cur) return;
  for(const d of daysOf(cur)){
    const acts=sortActs(cur.data.acts.filter(a=>a.day===d));
    for(let i=1;i<acts.length;i++){
      const p=acts[i-1], a=acts[i];
      if(p.lat==null||a.lat==null) continue;
      const el=document.getElementById('trav-'+a.id); if(!el) continue;
      const c=await osrm(p,a,'car');
      let txt=ic('car')+' '+durTxt(c.min);
      if(c.km<=6){ const f=await osrm(p,a,'foot'); txt+=' · '+ic('walk')+' '+durTxt(f.min); }
      const el2=document.getElementById('trav-'+a.id);
      if(el2){ el2.innerHTML=txt+' · '+(Math.round(c.km*10)/10)+' km'; el2.style.display='block'; }
    }
  }
}
/* weer per dag (Open-Meteo, gratis) */
function wmoIcon(c){
  if(c<=1) return 'sun';
  if(c<=3) return 'cloud';
  if(c<=48) return 'mist';
  if(c<=67) return 'cloud-rain';
  if(c<=77) return 'cloud-snow';
  if(c<=82) return 'cloud-rain';
  if(c<=86) return 'cloud-snow';
  return 'cloud-storm';
}
async function computeWeather(){
  if(!cur) return;
  const today=new Date().toISOString().slice(0,10), maxD=addDays(today,15);
  for(const r of stopRanges(cur)){
    const s=r.stop; if(s.lat==null) continue;
    const ds=rangeDays(r).filter(d=>d>=today&&d<=maxD);
    if(!ds.length) continue;
    const key=s.lat.toFixed(2)+','+s.lng.toFixed(2)+':'+ds[0];
    if(!WEATHER[key]){
      try{
        const rq=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+s.lat+'&longitude='+s.lng+'&daily=weather_code,temperature_2m_max&timezone=auto&start_date='+ds[0]+'&end_date='+ds[ds.length-1]);
        const js=await rq.json();
        const o={}; ((js.daily&&js.daily.time)||[]).forEach((d,i)=>{ o[d]={c:js.daily.weather_code[i],mx:js.daily.temperature_2m_max[i]}; });
        WEATHER[key]=o;
      }catch(e){ WEATHER[key]={}; }
    }
    ds.forEach(d=>{
      const w=WEATHER[key][d], el=document.getElementById('wx-'+d);
      if(w&&el) el.innerHTML=ic(wmoIcon(w.c))+' '+Math.round(w.mx)+'°';
    });
  }
}

  const role=document.getElementById('invRole').value;
  if(!/^\S+@\S+\.\S+$/.test(email)){ alert('Geef een geldig e-mailadres.'); return; }
  if(email===user.email){ alert('Dat ben je zelf.'); return; }
  const {error}=await sb.from('trip_invites').insert({trip_id:cur.id,email,role});

  el.value='';
  alert('Uitgenodigd! Zodra '+email+' inlogt (of een account maakt), verschijnt deze reis automatisch.');

}

/* agenda-export: alle activiteiten als agendapunten */
function exportIcs(){
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//TravAI//NL\r\n';
  const clean=s=>(s||'').replace(/[\r\n;,\\]/g,' ');
  cur.data.acts.filter(a=>a.day).forEach(a=>{
    const dt=a.day.replace(/-/g,'');
    const st=(a.time||'09:00').replace(':','')+'00';
    const en=(a.end||a.time||'10:00').replace(':','')+'00';
    ics+='BEGIN:VEVENT\r\nUID:'+a.id+'@travai\r\nDTSTART:'+dt+'T'+st+'\r\nDTEND:'+dt+'T'+en+'\r\nSUMMARY:'+clean(a.title)+'\r\n'+(a.addr?'LOCATION:'+clean(a.addr)+'\r\n':'')+(a.note?'DESCRIPTION:'+clean(a.note)+'\r\n':'')+'END:VEVENT\r\n';
  });
  cur.data.hotels.filter(h=>h.cin).forEach(x=>{
    ics+='BEGIN:VEVENT\r\nUID:'+x.id+'@travai\r\nDTSTART;VALUE=DATE:'+x.cin.replace(/-/g,'')+'\r\nDTEND;VALUE=DATE:'+(x.cout||x.cin).replace(/-/g,'')+'\r\nSUMMARY:Verblijf '+clean(x.name)+'\r\n'+(x.addr?'LOCATION:'+clean(x.addr)+'\r\n':'')+'END:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  const blob=new Blob([ics],{type:'text/calendar'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=(cur.name||'reis').replace(/\W+/g,'-')+'.ics'; a.click();
}

/* --- geocode helper (Nominatim) --- */
async function geocode(addr){
  if(!addr) return null;
  if(GEOCACHE[addr]!==undefined) return GEOCACHE[addr];
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(addr));
    const js=await r.json();
    GEOCACHE[addr]=js[0]?{lat:+js[0].lat,lng:+js[0].lon}:null;
  }catch(e){ GEOCACHE[addr]=null; }
  return GEOCACHE[addr];
}

async function saveTrip(id){
  const name=document.getElementById('f_name').value.trim();
  if(!name){ alert('Geef de reis een naam.'); return; }
  let start=document.getElementById('f_start').value||null, end=document.getElementById('f_end').value||null;
  if(start&&end&&end<start){ const tmp=start; start=end; end=tmp; }
  const row={name, dest:document.getElementById('f_dest').value.trim(), start_date:start, end_date:end, emoji:pickedIcon, updated_at:new Date().toISOString()};
  let error, newId=null;
  if(id){ ({error}=await sb.from('trips').update(row).eq('id',id)); }
  else {
    row.owner=user.id; row.data={stops:[],acts:[],hotels:[],todos:[],pack:[],exps:[],notes:''};
    const res=await sb.from('trips').insert(row).select('id').single();
    error=res.error; newId=res.data&&res.data.id;
  }
  if(error){ alert('Bewaren mislukt: '+error.message); return; }
  await loadTrips(); closeSheet();
  if(newId){ openTrip(newId); } else render();
}
async function delTrip(id){

  const {error}=await sb.from('trips').delete().eq('id',id);
  if(error){ alert('Verwijderen mislukt: '+error.message); return; }
  await loadTrips(); closeSheet(); goHome();
}

let actTimer=null, ACTRES=[], ACTPICK=null, ACTPHOTO=null, ACTGPID=null;
function actInput(v){
  clearTimeout(actTimer); ACTPICK=null;
  if(v.trim().length<3){ const el=document.getElementById('actAc'); if(el){el.classList.remove('show');el.innerHTML='';} return; }
  actTimer=setTimeout(()=>searchActPlaces(v.trim()),350);
}
function actBiasCenter(){
  const dayEl=document.getElementById('f_day');
  const day=dayEl?dayEl.value:null;
  if(day){
    const r=stopRanges(cur).find(rr=>rr.stop.lat!=null&&rangeDays(rr).includes(day));
    if(r) return {latitude:r.stop.lat,longitude:r.stop.lng};
  }
  const s=cur.data.stops.find(x=>x.lat!=null);
  return s?{latitude:s.lat,longitude:s.lng}:null;
}
async function searchActPlaces(q){
  ACTRES=[];
  if(GMAPS_KEY){
    try{
      const bias=actBiasCenter();
      const r=await fetch('https://places.googleapis.com/v1/places:searchText',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-Goog-Api-Key':GMAPS_KEY,
          'X-Goog-FieldMask':'places.id,places.displayName,places.formattedAddress,places.location,places.rating,places.photos,places.primaryType,places.regularOpeningHours'},
        body:JSON.stringify(Object.assign({textQuery:q,maxResultCount:6,languageCode:'nl'},
          bias?{locationBias:{circle:{center:bias,radius:30000}}}:{}))
      });
      const js=await r.json();
      ACTRES=(js.places||[]).map(p=>({
        name:p.displayName&&p.displayName.text, addr:p.formattedAddress,
        lat:p.location&&p.location.latitude, lng:p.location&&p.location.longitude,
        kind:p.primaryType, gpid:p.id,
        rating:p.rating, periods:p.regularOpeningHours&&p.regularOpeningHours.periods,
        photo:(p.photos&&p.photos[0])?'https://places.googleapis.com/v1/'+p.photos[0].name+'/media?maxWidthPx=240&key='+GMAPS_KEY:null
      })).filter(p=>p.name);
    }catch(e){ ACTRES=[]; }
  }
  if(!ACTRES.length){
    /* terugval op OpenStreetMap (bv. als Places geblokkeerd is op dit domein) */
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=nl&q='+encodeURIComponent(q));
      const js=await r.json();
      ACTRES=js.map(p=>({name:p.name||p.display_name.split(',')[0],addr:p.display_name,lat:+p.lat,lng:+p.lon}));
    }catch(e){}
  }
  const el=document.getElementById('actAc'); if(!el) return;
  if(!ACTRES.length){ el.classList.remove('show'); el.innerHTML=''; return; }
  el.innerHTML=ACTRES.map((p,i)=>'<button onclick="pickActPlace('+i+')">'+esc(p.name)+
    (p.rating?' <span style="color:var(--amber)">★ '+p.rating+'</span>':'')+
    '<small>'+esc(p.addr||'')+'</small></button>').join('');
  el.classList.add('show');
}

/* beste dag voor een plek: dichtstbijzijnde bestemming, dag met de minste planning */
function bestDayForPlace(lat,lng){
  if(!cur||lat==null) return null;
  let best=null, bd=Infinity;
  stopRanges(cur).forEach(r=>{
    if(r.stop.lat==null||!r.from||r.stop.nights<1) return;
    const d=havKm({lat,lng},{lat:r.stop.lat,lng:r.stop.lng});
    if(d<bd){ bd=d; best=r; }
  });
  if(!best) return null;
  const ds=rangeDays(best);
  let day=ds[0], cnt=Infinity;
  ds.forEach(x=>{ const c=cur.data.acts.filter(a=>a.day===x).length; if(c<cnt){ cnt=c; day=x; } });
  return day;
}
function pickActPlace(i){
  const p=ACTRES[i]; if(!p) return;
  ACTPICK={lat:p.lat,lng:p.lng};
  ACTPHOTO=p.photo||null;
  ACTGPID=p.gpid||null;
  /* dag automatisch afleiden uit de plek (blijft aanpasbaar) */
  const bd=bestDayForPlace(p.lat,p.lng);
  if(bd){ const sel=document.getElementById('f_day'); if(sel) sel.value=bd; }
  if(p.kind&&GTYPE_MAP[p.kind]){
    pickedType=GTYPE_MAP[p.kind];
    const tp=document.getElementById('actTypes');
    if(tp) tp.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===pickedType));
  }
  document.getElementById('f_title').value=p.name;
  if(p.addr) document.getElementById('f_addr').value=p.addr;
  if(p.periods){
    const dayEl=document.getElementById('f_day');
    const wd=new Date((dayEl&&dayEl.value?dayEl.value:new Date().toISOString().slice(0,10))+'T12:00').getDay();
    const x=p.periods.find(q=>q.open&&q.open.day===wd);
    if(x) document.getElementById('f_opens').value=String(x.open.hour).padStart(2,'0')+':'+String(x.open.minute||0).padStart(2,'0');
  }
  const el=document.getElementById('actAc'); if(el){el.classList.remove('show');el.innerHTML='';}
}

async function saveAct(id,preLat,preLng){
  const title=document.getElementById('f_title').value.trim();
  if(!title){ alert('Geef een omschrijving.'); return; }
  const addr=document.getElementById('f_addr').value.trim();
  const data={ title, type:pickedType, day:document.getElementById('f_day').value, time:document.getElementById('f_time').value,
    end:document.getElementById('f_aend').value,
    opens:document.getElementById('f_opens').value, addr, note:document.getElementById('f_note').value.trim() };
  const old=id?cur.data.acts.find(x=>x.id===id):null;
  if(ACTPICK&&ACTPICK.lat!=null){ data.lat=ACTPICK.lat; data.lng=ACTPICK.lng; }
  else if(preLat!=null&&preLng!=null){ data.lat=preLat; data.lng=preLng; }
  else if(addr && (!old||old.addr!==addr)){
    const g=await geocode(addr);
    if(g){ data.lat=g.lat; data.lng=g.lng; }
  } else if(old){ data.lat=old.lat; data.lng=old.lng; }
  data.photo=ACTPHOTO||(old?old.photo:null);
  data.gpid=ACTGPID||(old?old.gpid:null);
  if(id) Object.assign(old, data);
  else cur.data.acts.push(Object.assign({id:uid()},data));
  await pushData(); closeSheet(); render();
}
async function delAct(id){ cur.data.acts=cur.data.acts.filter(x=>x.id!==id); await pushData(); closeSheet(); render(); }

/* activiteit als tussenstop in de route opnemen, op de plek met de kleinste omweg */
async function actToStop(actId){
  const a=cur.data.acts.find(x=>x.id===actId);
  if(!a||a.lat==null){ alert('Deze activiteit heeft nog geen locatie. Kies een zoeksuggestie of vul een adres in en bewaar eerst.'); return; }
  const ss=cur.data.stops;
  if(ss.some(s=>s.lat===a.lat&&s.lng===a.lng)){ alert('Deze plek staat al op de route.'); return; }
  let best=ss.length, bestD=Infinity;
  for(let i=1;i<ss.length;i++){
    const p=ss[i-1], n=ss[i];
    if(p.lat==null||n.lat==null) continue;
    const d=havKm(p,a)+havKm(a,n)-havKm(p,n);
    if(d<bestD){ bestD=d; best=i; }
  }
  ss.splice(best,0,{id:uid(),name:a.title,lat:a.lat,lng:a.lng,nights:0});
  await pushData(); closeSheet(); tab='route'; render();
}

/* --- slaapplek --- */
let hotTimer=null, HOTRES=[], HOTPICK=null, HOTBIAS=null;
function hotInput(v){
  clearTimeout(hotTimer); HOTPICK=null;
  if(v.trim().length<3){ const el=document.getElementById('hotAc'); if(el){el.classList.remove('show');el.innerHTML='';} return; }
  hotTimer=setTimeout(()=>searchHotPlaces(v.trim()),350);
}
async function searchHotPlaces(q){
  HOTRES=[];
  if(GMAPS_KEY){
    try{
      const r=await fetch('https://places.googleapis.com/v1/places:searchText',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-Goog-Api-Key':GMAPS_KEY,
          'X-Goog-FieldMask':'places.id,places.displayName,places.formattedAddress,places.location,places.rating,places.internationalPhoneNumber'},
        body:JSON.stringify(Object.assign({textQuery:q,maxResultCount:6,languageCode:'nl'},
          HOTBIAS?{locationBias:{circle:{center:HOTBIAS,radius:30000}}}:{}))
      });
      const js=await r.json();
      HOTRES=(js.places||[]).map(p=>({
        name:p.displayName&&p.displayName.text, addr:p.formattedAddress,
        lat:p.location&&p.location.latitude, lng:p.location&&p.location.longitude,
        gpid:p.id, rating:p.rating, tel:p.internationalPhoneNumber
      })).filter(p=>p.name);
    }catch(e){ HOTRES=[]; }
  }
  if(!HOTRES.length){
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=nl&q='+encodeURIComponent(q));
      const js=await r.json();
      HOTRES=js.map(p=>({name:p.name||p.display_name.split(',')[0],addr:p.display_name,lat:+p.lat,lng:+p.lon}));
    }catch(e){}
  }
  const el=document.getElementById('hotAc'); if(!el) return;
  if(!HOTRES.length){ el.classList.remove('show'); el.innerHTML=''; return; }
  el.innerHTML=HOTRES.map((p,i)=>'<button onclick="pickHotPlace('+i+')">'+esc(p.name)+
    (p.rating?' <span style="color:var(--amber)">★ '+p.rating+'</span>':'')+
    '<small>'+esc(p.addr||'')+'</small></button>').join('');
  el.classList.add('show');
}
function pickHotPlace(i){
  const p=HOTRES[i]; if(!p) return;
  HOTPICK={lat:p.lat,lng:p.lng,gpid:p.gpid};
  document.getElementById('f_hname').value=p.name;
  if(p.addr) document.getElementById('f_haddr').value=p.addr;
  if(p.tel) document.getElementById('f_tel').value=p.tel;
  const el=document.getElementById('hotAc'); if(el){el.classList.remove('show');el.innerHTML='';}
}
function sheetHotel(id,stopId){
  const x=id?cur.data.hotels.find(y=>y.id===id):null;
  let cin='', cout='';
  HOTPICK=null; HOTRES=[]; HOTBIAS=null;
  if(!x&&stopId){
    const r=stopRanges(cur).find(rr=>rr.stop.id===stopId);
    if(r&&r.from){ cin=r.from; cout=r.to; }
    if(r&&r.stop.lat!=null) HOTBIAS={latitude:r.stop.lat,longitude:r.stop.lng};
  }
  if(!HOTBIAS){
    const src=(x&&x.lat!=null)?x:cur.data.stops.find(s=>s.lat!=null);
    if(src) HOTBIAS={latitude:src.lat,longitude:src.lng};
  }
  openSheet('<h2>'+ic('bed')+' '+(x?'Slaapplek bewerken':'Slaapplek toevoegen')+'</h2>'+
    '<div class="field" style="position:relative"><label>Naam (zoek hotel via Google of typ vrij)</label><input id="f_hname" autocomplete="off" oninput="hotInput(this.value)" placeholder="Bijv. Hotel Alpenblick" value="'+esc(x?x.name:'')+'"><div class="ac" id="hotAc"></div></div>'+
    '<div class="field"><label>Adres</label><input id="f_haddr" placeholder="Hauptstraße 12, München" value="'+esc(x?x.addr:'')+'"></div>'+
    '<div class="row2"><div class="field"><label>Check-in</label><input id="f_cin" type="date" value="'+(x?(x.cin||''):cin)+'"></div>'+
    '<div class="field"><label>Check-out</label><input id="f_cout" type="date" value="'+(x?(x.cout||''):cout)+'"></div></div>'+
    '<div class="row2"><div class="field"><label>Boekingsnr</label><input id="f_ref" value="'+esc(x?x.ref:'')+'"></div>'+
    '<div class="field"><label>Telefoon</label><input id="f_tel" type="tel" value="'+esc(x?x.tel:'')+'"></div></div>'+
    '<div class="field"><label>Notitie</label><textarea id="f_hnote" rows="2">'+esc(x?x.note:'')+'</textarea></div>'+
    '<div class="btns">'+(x?'<button class="btn danger" onclick="delHotel(\''+x.id+'\')">'+ic('trash')+'</button>':'')+
    '<button class="btn ghost" onclick="closeSheet()">Annuleer</button>'+
    '<button class="btn primary" onclick="saveHotel(\''+(x?x.id:'')+'\',\''+(stopId||'')+'\')">Bewaar</button></div>');
}
async function saveHotel(id,stopId){
  const name=document.getElementById('f_hname').value.trim();
  if(!name){ alert('Geef een naam.'); return; }
  const addr=document.getElementById('f_haddr').value.trim();
  const data={ name, addr,
    cin:document.getElementById('f_cin').value, cout:document.getElementById('f_cout').value,
    ref:document.getElementById('f_ref').value.trim(), tel:document.getElementById('f_tel').value.trim(),
    note:document.getElementById('f_hnote').value.trim() };
  const old=id?cur.data.hotels.find(y=>y.id===id):null;
  if(stopId) data.stopId=stopId; else if(old&&old.stopId) data.stopId=old.stopId;
  if(HOTPICK&&HOTPICK.lat!=null){ data.lat=HOTPICK.lat; data.lng=HOTPICK.lng; data.gpid=HOTPICK.gpid; }
  else if(addr && (!old||old.addr!==addr)){
    const g=await geocode(addr);
    if(g){ data.lat=g.lat; data.lng=g.lng; }
    if(old) data.gpid=old.gpid;
  } else if(old){ data.lat=old.lat; data.lng=old.lng; data.gpid=old.gpid; }
  if(id) Object.assign(old, data);
  else cur.data.hotels.push(Object.assign({id:uid()},data));
  await pushData(); closeSheet(); render();
}
async function delHotel(id){ cur.data.hotels=cur.data.hotels.filter(y=>y.id!==id); await pushData(); closeSheet(); render(); }

/* --- uitgave --- */
function sheetExp(id){
  const x=id?cur.data.exps.find(y=>y.id===id):null;
  pickedCat=x?(x.cat||'other'):'other';
  openSheet('<h2>'+ic('wallet')+' '+(x?'Uitgave bewerken':'Uitgave toevoegen')+'</h2>'+
    '<div class="field"><label>Omschrijving</label><input id="f_edesc" placeholder="Bijv. diner München" value="'+esc(x?x.desc:'')+'"></div>'+
    '<div class="row2"><div class="field"><label>Bedrag (€)</label><input id="f_eamt" type="number" step="0.01" inputmode="decimal" value="'+(x?x.amount:'')+'"></div>'+
    '<div class="field"><label>Datum</label><input id="f_eday" type="date" value="'+(x?(x.day||''):'')+'"></div></div>'+
    '<div class="field"><label>Categorie</label><div class="type-pick">'+Object.entries(EXP_CATS).map(([k,v])=>'<button class="'+(k===pickedCat?'on':'')+'" onclick="pickCat(\''+k+'\',this)">'+ic(v[0])+' '+v[1]+'</button>').join('')+'</div></div>'+
    '<div class="btns">'+(x?'<button class="btn danger" onclick="delExp(\''+x.id+'\')">'+ic('trash')+'</button>':'')+
    '<button class="btn ghost" onclick="closeSheet()">Annuleer</button>'+
    '<button class="btn primary" onclick="saveExp(\''+(x?x.id:'')+'\')">Bewaar</button></div>');
}
async function saveExp(id){
  const desc=document.getElementById('f_edesc').value.trim();
  const amount=parseFloat(document.getElementById('f_eamt').value);
  if(!desc||isNaN(amount)){ alert('Vul omschrijving en bedrag in.'); return; }
  const data={desc, amount, cat:pickedCat, day:document.getElementById('f_eday').value};
  if(id) Object.assign(cur.data.exps.find(y=>y.id===id), data);
  else cur.data.exps.push(Object.assign({id:uid()},data));
  await pushData(); closeSheet(); render();
}
async function delExp(id){ cur.data.exps=cur.data.exps.filter(y=>y.id!==id); await pushData(); closeSheet(); render(); }

  /* versienummer = publicatiemoment van dit bestand (automatisch bij elke deploy) */

  sb=window.supabase.createClient(SB_URL,SB_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(session){ user=session.user; await afterLogin(); }
  else { view='auth'; render(); }
}
boot();
